name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Byte-compile & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Only the lightweight test dependencies are installed. The full
      # training environment stays out of CI so this job remains fast,
      # deterministic and runnable on stock runners.
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check "numpy==2.2.6" "pytest==8.3.5"

      - name: Byte-compile tracked Python sources
        run: git ls-files -z '*.py' | xargs -0 -r python -m py_compile

      - name: Run unit tests
        run: python -m pytest tests/ -q
